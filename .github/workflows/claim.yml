name: Claim Free Games

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - name: Run Claimer Container
        run: |
          docker run --rm \
            -e EMAIL="${{ secrets.EMAIL }}" \
            -e PASSWORD="${{ secrets.PASSWORD }}" \
            -e EG_AUTH_CODE="${{ secrets.EG_AUTH_CODE }}" \
            -e EG_DEVICE_AUTH="${{ secrets.EG_DEVICE_AUTH }}" \
            -e EG_CLAIM_UNREAL="true" \
            ghcr.io/vogler/free-games-claimer:latest sh -c "node epic-games.js && node gog.js"
