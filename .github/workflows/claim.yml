name: Claim Free Games

on:
  schedule:
    - cron: '0 19 * * 4' # Her Perşembe 19:00 UTC otomatik çalışır
  workflow_dispatch: # Manuel tetikleme butonu ekler

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node index.js
        env:
          EG_EMAIL: ${{ secrets.EMAIL }}
          EG_PASSWORD: ${{ secrets.PASSWORD }}
          EG_CLAIM_UNREAL: 'true'
