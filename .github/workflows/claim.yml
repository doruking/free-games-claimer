name: Setup Device Auth

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Epic Auth Kodu'
        required: true

jobs:
  get-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Anahtarlari Uret
        run: |
          RESPONSE=$(curl -s -d "grant_type=authorization_code&code=${{ github.event.inputs.auth_code }}" -u "34a02cf8f4414e29b15920beb32236f4:abc" https://account-public-service-prod07.ol.epicgames.com/account/api/oauth/token)
          TOKEN=$(echo $RESPONSE | jq -r .access_token)
          ACCOUNT_ID=$(echo $RESPONSE | jq -r .account_id)
          
          DEVICE_AUTH=$(curl -s -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{}" https://account-public-service-prod07.ol.epicgames.com/account/api/public/account/$ACCOUNT_ID/deviceAuth)
          
          echo "=========================================="
          echo "EPIC_ACCOUNT_ID: $ACCOUNT_ID"
          echo "EPIC_DEVICE_ID: $(echo $DEVICE_AUTH | jq -r .deviceId)"
          echo "EPIC_SECRET: $(echo $DEVICE_AUTH | jq -r .secret)"
          echo "=========================================="
