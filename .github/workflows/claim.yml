name: Claim Free Games

on:
  schedule:
    - cron: '0 19 * * *' # Her gün saat 19:00 UTC (Türkiye saatiyle 22:00) çalışır
  workflow_dispatch: # Manuel çalıştırma butonu

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - name: Run Free Games Claimer
        uses: docker://ghcr.io/vogler/free-games-claimer:latest
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          CLAIM_UNREAL: 'true'
