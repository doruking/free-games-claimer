name: Claim Free Games

on:
  schedule:
    - cron: '0 19 * * *' # Her gün 19:00 UTC (TSİ 22:00)
  workflow_dispatch: # Manuel çalıştırma butonu

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - name: Run Claimer Container
        run: |
          docker run --rm \
            -e EMAIL="${{ secrets.EMAIL }}" \
            -e PASSWORD="${{ secrets.PASSWORD }}" \
            -e EG_CLAIM_UNREAL="true" \
            ghcr.io/vogler/free-games-claimer:latest
