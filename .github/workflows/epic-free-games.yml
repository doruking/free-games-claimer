name: Ücretsiz Oyunlar (Epic ve Fab)

on:
  schedule:
    # Epic yeni oyunları 11:00 ET'de, Fab içerikleri 9:00 ET'de açar (yaz/kış saati için iki saat denenir).
    - cron: '20 15,16 * * *'
    # Kaçırılanlar için her sabah bir kontrol daha.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Sadece test bildirimi gönder'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: epic-free-games
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ücretsiz oyunları kontrol et
        run: node scripts/epic-free-games.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOTIFY_TEST: ${{ inputs.test && '1' || '' }}
          # Telefon bildirimi (ntfy uygulaması). İstersen NTFY_TOPIC adıyla Secret ekleyerek gizli bir konu kullanabilirsin.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'fgc-6fc843db8722' }}
          # İsteğe bağlı: Secrets olarak eklenirse bu kanallara da bildirim gider.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Sonucu depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-games
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Ücretsiz oyun listesi güncellendi"
            git pull --rebase -q
            git push
          fi
