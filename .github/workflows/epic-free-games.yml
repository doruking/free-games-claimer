name: Ücretsiz Oyunlar (Epic ve Fab)

on:
  schedule:
    # Her 30 dakikada bir; gece 23:00-05:00 (İstanbul) arası çalışmaz.
    # Cron UTC'dir: 02:00-19:30 UTC = 05:00-22:30 İstanbul. (Yoğun saatlerde GitHub çalıştırmaları geciktirebilir.)
    - cron: '0,30 2-19 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Sadece test bildirimi gönder'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: epic-free-games
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ücretsiz oyunları kontrol et
        run: node scripts/epic-free-games.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOTIFY_TEST: ${{ inputs.test && '1' || '' }}
          # Telefon bildirimi (ntfy uygulaması): gizli konu adı NTFY_TOPIC Secret'ında tutulur.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # İsteğe bağlı: Secrets olarak eklenirse bu kanallara da bildirim gider.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Sonucu depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-games
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Ücretsiz oyun listesi güncellendi"
            git pull --rebase -q
            git push
          fi
